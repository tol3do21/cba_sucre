<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>CBA Sucre — Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Inter:wght@400;500;600;700;800&family=Archivo+Black&display=swap" />
  <style>
    html, body { margin: 0; padding: 0; background: #1a1a1a; font-family: 'Inter', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared-data.jsx"></script>
  <script type="text/babel" src="direction-a-top.jsx"></script>
  <script type="text/babel" src="direction-a2-top.jsx"></script>
  <script type="text/babel" src="direction-a2-rest.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas title="CBA Sucre · Embassy Classic" subtitle="Home — header e hero institucional, cuerpo editorial. Cliqueables: programas, calendario, formulario.">
          <DCSection id="home" title="Home · Página de inicio">
            <DCArtboard id="home" label="Home" width={A2_W} height={5600} style={{background:'#fff'}}>
              <DirectionA2 />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    const waitForReady = setInterval(() => {
      if (window.DirectionA2 && window.DesignCanvas && window.DCSection && window.DCArtboard) {
        clearInterval(waitForReady);
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      }
    }, 50);
  </script>
</body>
</html>
