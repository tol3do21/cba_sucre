<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>CBA Sucre — Home (móvil)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Inter:wght@400;500;600;700;800&family=Archivo+Black&display=swap" />
  <style>
    :root { --bg: #0A2540; --ink:#fff; --muted:#9aa4b2; --red:#B22234; --gold:#C9A961; --cream:#F5EFE0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(10,37,64,0.95); backdrop-filter: blur(10px);
      border-bottom: 3px solid var(--red);
      padding: 14px 16px;
    }
    .topbar .eyebrow { font-size: 10px; color: var(--gold); letter-spacing: 4px; font-weight: 700; }
    .topbar .title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; font-style: italic; margin-top: 4px; }
    .topbar .sub { font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }

    .stage { padding: 16px; }

    .panel {
      background: #fff; color: #000;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      margin-bottom: 24px;
      border-top: 4px solid var(--red);
    }
    .panel-tag {
      padding: 10px 14px; background: #fff;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #eee;
    }
    .panel-tag .badge { font-family: 'Playfair Display', serif; font-size: 13px; color: #0A2540; font-weight: 700; font-style: italic; }
    .panel-tag .hint { font-size: 10px; color: #999; letter-spacing: 2px; text-transform: uppercase; }

    .scaler { width: 100%; overflow: hidden; position: relative; }
    .scaler-inner {
      width: 1440px;
      transform-origin: top left;
      pointer-events: none;
    }

    .footer {
      padding: 24px 16px 60px; text-align: center; font-size: 12px;
      color: var(--muted); line-height: 1.6;
      font-family: 'Playfair Display', serif; font-style: italic;
    }
    .footer strong { color: #fff; font-style: normal; font-family: 'Inter', sans-serif; letter-spacing: 0.5px; }
    .footer .stars { color: var(--gold); letter-spacing: 8px; margin-bottom: 10px; font-size: 14px; font-style: normal; }

    .loading {
      padding: 80px 20px; text-align: center; color: #999; font-size: 13px;
      font-family: 'Playfair Display', serif; font-style: italic;
    }
    .loading .dot { display: inline-block; width: 8px; height: 8px; background: var(--red); border-radius: 50%; margin: 0 3px; animation: pulse 1.2s infinite; }
    .loading .dot:nth-child(2) { animation-delay: 0.2s; }
    .loading .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="topbar">
    <div class="eyebrow">★  EST. 1962  ★</div>
    <div class="title">The Bolivian–American</div>
    <div class="sub">CBA Sucre · Home</div>
  </div>

  <div class="stage">
    <div class="panel">
      <div class="panel-tag">
        <span class="badge">★ Home · Embassy Classic</span>
        <span class="hint">Desliza ↕</span>
      </div>
      <div class="scaler"><div class="scaler-inner" id="mount"><div class="loading">Cargando home <span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div></div>
    </div>
  </div>

  <div class="footer">
    <div class="stars">★ ★ ★</div>
    Vista a escala del home. Para verlo al 100% y poder interactuar (tabs de programas, filtros del calendario, formulario) abre <strong>CBA Sucre.html</strong> en escritorio.
  </div>

  <script>
    function applyScale() {
      const c = document.querySelector('.scaler');
      if (!c || c.clientWidth === 0) return;
      const inner = c.querySelector('.scaler-inner');
      const scale = c.clientWidth / 1440;
      inner.style.transform = 'scale(' + scale + ')';
      c.style.height = (inner.scrollHeight * scale) + 'px';
    }
    window.addEventListener('resize', applyScale);
    let scaleTimer = setInterval(applyScale, 250);
    setTimeout(() => { clearInterval(scaleTimer); applyScale(); }, 8000);
  </script>

  <script type="text/babel" src="shared-data.jsx"></script>
  <script type="text/babel" src="direction-a-top.jsx"></script>
  <script type="text/babel" src="direction-a2-top.jsx"></script>
  <script type="text/babel" src="direction-a2-rest.jsx"></script>

  <script type="text/babel">
    const waitReady = setInterval(() => {
      if (window.DirectionA2) {
        clearInterval(waitReady);
        ReactDOM.createRoot(document.getElementById('mount')).render(<DirectionA2 />);
        setTimeout(applyScale, 200);
        setTimeout(applyScale, 800);
        setTimeout(applyScale, 2000);
      }
    }, 50);
  </script>
</body>
</html>
